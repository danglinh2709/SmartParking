<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartParking | Real-time Monitoring</title>
    <link rel="stylesheet" href="slots.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="topbar.css" />
  </head>
  <body>
    <!-- 1. COMPACT HEADER -->
    <div id="unified-topbar"></div>

    <main class="container">
      <!-- 2. OVERVIEW SECTION (Compact Stat Cards) -->
      <section class="stats-grid">
        <div class="stat-card total">
          <div class="stat-icon"><i class="fas fa-layer-group"></i></div>
          <div class="stat-info">
            <h4 id="stat-total">0</h4>
            <p>Total Slots</p>
          </div>
          <div class="trend up"><i class="fas fa-caret-up"></i> 100%</div>
        </div>
        <div class="stat-card free">
          <div class="stat-icon"><i class="fas fa-circle-check"></i></div>
          <div class="stat-info">
            <h4 id="stat-free">0</h4>
            <p>Available</p>
          </div>
          <div class="trend down"><i class="fas fa-caret-down"></i> 12%</div>
        </div>
        <div class="stat-card occupied">
          <div class="stat-icon"><i class="fas fa-car-side"></i></div>
          <div class="stat-info">
            <h4 id="stat-occupied">0</h4>
            <p>Occupied</p>
          </div>
          <div class="trend up"><i class="fas fa-caret-up"></i> 5%</div>
        </div>
        <div class="stat-card reserved">
          <div class="stat-icon"><i class="fas fa-calendar-check"></i></div>
          <div class="stat-info">
            <h4 id="stat-reserved">0</h4>
            <p>Reserved</p>
          </div>
        </div>
        <div class="stat-card maintenance">
          <div class="stat-icon"><i class="fas fa-screwdriver-wrench"></i></div>
          <div class="stat-info">
            <h4 id="stat-maintenance">0</h4>
            <p>Maintenance</p>
          </div>
        </div>
      </section>

      <!-- 3. FILTER + SEARCH BAR (One Horizontal Toolbar) -->
      <section class="toolbar">
        <div class="search-wrapper">
          <i class="fas fa-search"></i>
          <input
            type="text"
            id="searchSpot"
            placeholder="Search by code, plate, or customer..."
          />
        </div>

        <div class="tool-group">
          <select id="filterStatus">
            <option value="ALL">All Status</option>
            <option value="FREE">Available</option>
            <option value="OCCUPIED">Occupied</option>
            <option value="PAID">Reserved</option>
            <option value="MAINTENANCE">Maintenance</option>
            <option value="LOCKED">Locked</option>
          </select>

          <select id="sortBy">
            <option value="code">Sort: Slot Code</option>
            <option value="status">Sort: Status</option>
            <option value="time">Sort: Entry Time</option>
          </select>

          <button class="btn-icon" id="refreshBtn" title="Refresh data">
            <i class="fas fa-sync-alt"></i>
          </button>

          <button class="btn-export" id="btnExport">
            <i class="fas fa-file-export"></i>
            Export
          </button>
        </div>
      </section>

      <!-- 4. PARKING ZONE SECTION (Rendered via JS) -->
      <div id="zoneContainer" class="zone-container">
        <div class="loading">Initializing system data...</div>
      </div>

      <!-- Pagination (Tighter spacing) -->
      <div class="pagination" id="pagination"></div>
    </main>

    <!-- HOVER INFO CARD -->
    <div id="slotHoverCard" class="slot-hover-card">
      <div class="hover-head">
        <span id="hoverCode">A1-01</span>
        <span id="hoverStatus" class="status-badge">Available</span>
      </div>
      <div class="hover-body">
        <div class="hover-row">
          <label>Plate:</label>
          <span id="hoverPlate">-</span>
        </div>
        <div class="hover-row">
          <label>Time:</label>
          <span id="hoverTime">-</span>
        </div>
      </div>
    </div>

    <!-- 7. REAL-TIME INDICATOR -->
    <div id="updatingIndicator" class="updating-indicator">
      <div class="spinner"></div>
      SYNCING LIVE DATA
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- MODAL REDESIGN -->
    <div id="detailModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <h2 id="modalTitle">Slot #--</h2>
            <span id="modalStatusBadge" class="zone-tag">Status</span>
          </div>
          <span class="close">&times;</span>
        </div>

        <div class="detail-grid">
          <div class="detail-item">
            <label>Customer</label>
            <span id="modalCustomer">-</span>
          </div>
          <div class="detail-item">
            <label>Phone</label>
            <span id="modalPhone">-</span>
          </div>
          <div class="detail-item">
            <label>License Plate</label>
            <span id="modalPlate">-</span>
          </div>
          <div class="detail-item">
            <label>Vehicle Type</label>
            <span id="modalVehicleType">-</span>
          </div>
          <div class="detail-item">
            <label>Entry Time</label>
            <span id="modalTime">-</span>
          </div>
          <div class="detail-item">
            <label>Exp. Checkout</label>
            <span id="modalEndTime">-</span>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-danger" id="btnLockSpot">Lock Slot</button>
          <button class="btn btn-ghost" id="btnMaintSpot">Maintenance</button>
          <button
            class="btn btn-primary"
            id="btnReleaseSpot"
            style="grid-column: 1 / -1"
          >
            Force Release
          </button>
          <button
            class="btn btn-primary"
            id="btnUnlockSpot"
            style="display: none; grid-column: 1 / -1"
          >
            Unlock Slot
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="topbar.js"></script>
    <script>renderTopbar('slots');</script>
    <script src="slots.js"></script>
  </body>
</html>
