<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Staff | Tra cứu & Quản lý vé</title>
    <link rel="stylesheet" href="ticketManagement.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="logo">🚗 SmartParking</div>
      <nav class="menu">
        <a href="verify.html">Vận hành xe ra / vào</a>
        <a href="slots.html">Quản lý ô đỗ</a>
        <a href="ticketManagement.html" class="active">Quản lý vé</a>
      </nav>
      <div class="user">
        <span id="parkingName"></span>
        <button id="logoutBtn">Đăng xuất</button>
      </div>
    </header>

    <main class="dashboard">
      <div class="header-actions">
        <h2>Tra cứu & Quản lý Vé</h2>
        <div class="actions-right">
          <input type="text" id="searchInput" placeholder="Tìm biển số, khách hàng, mã vé..." />
          <select id="filterType">
            <option value="ALL">Tất cả</option>
            <option value="PRE-BOOKED">Vé đặt trước</option>
            <option value="MONTHLY">Vé tháng</option>
            <option value="YEARLY">Vé năm</option>
          </select>
          <button class="btn primary" id="addTicketBtn"><i class="fas fa-plus"></i> Thêm vé dài hạn</button>
        </div>
      </div>

      <div class="table-container">
        <table id="ticketTable">
          <thead>
            <tr>
              <th>Mã vé</th>
              <th>Loại vé</th>
              <th>Khách hàng</th>
              <th>SĐT</th>
              <th>Biển số</th>
              <th>Loại xe</th>
              <th>Hiệu lực đến</th>
              <th>Trạng thái</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody>
            <!-- Dữ liệu JS -->
          </tbody>
        </table>
      </div>
    </main>

    <!-- Modal Thêm/Sửa -->
    <div id="ticketModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modalTitle">Thêm vé dài hạn</h3>
          <span class="close-modal">&times;</span>
        </div>
        <form id="ticketForm">
          <input type="hidden" id="ticketId" />

          <div class="form-row">
            <div class="form-group">
              <label>Loại vé</label>
              <select id="ticketType" required>
                <option value="MONTHLY">Vé tháng</option>
                <option value="YEARLY">Vé năm</option>
              </select>
            </div>
            <div class="form-group">
              <label>Mã vé (VD: TM-001)</label>
              <input type="text" id="ticketCode" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Khách hàng</label>
              <input type="text" id="customerName" required />
            </div>
            <div class="form-group">
              <label>Số điện thoại</label>
              <input type="text" id="phone" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Biển số xe</label>
              <input type="text" id="licensePlate" required />
            </div>
            <div class="form-group">
              <label>Loại phương tiện</label>
              <select id="vehicleType" required>
                <option value="MOTORBIKE">Xe máy</option>
                <option value="CAR">Ô tô</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Ngày bắt đầu</label>
              <input type="datetime-local" id="startDate" required />
            </div>
            <div class="form-group">
              <label>Ngày kết thúc</label>
              <input type="datetime-local" id="endDate" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Giá vé (VNĐ)</label>
              <input type="number" id="price" value="0" />
            </div>
            <div class="form-group">
              <label>Trạng thái</label>
              <select id="status">
                <option value="ACTIVE">Hoạt động</option>
                <option value="EXPIRED">Hết hạn</option>
                <option value="CANCELLED">Hủy bỏ</option>
              </select>
            </div>
          </div>

          <div class="form-group full-width">
            <label>Ghi chú</label>
            <textarea id="notes" rows="2"></textarea>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn secondary" id="cancelFormBtn">Hủy</button>
            <button type="submit" class="btn primary">Lưu thông tin</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal Xác nhận Xóa -->
    <div id="deleteModal" class="modal">
      <div class="modal-content warning">
        <h3>Xác nhận xóa</h3>
        <p>Bạn có chắc chắn muốn xóa vé này không? Thao tác này không thể hoàn tác.</p>
        <div class="modal-footer">
          <button class="btn secondary" onclick="closeDeleteModal()">Hủy</button>
          <button class="btn danger" id="confirmDeleteBtn">Xóa vé</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="ticketManagement.js"></script>
  </body>
</html>
