version: '3.8'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartparking_sqlserver
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'YourStrong!Passw0rd'
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong!Passw0rd", "-C", "-Q", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
  ocr_service:
    build:
      context: ./backend/ocr_service
    container_name: smartparking_ocr
    ports:
      - "6000:6000"
  backend:
    build:
      context: ./backend
    container_name: smartparking_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - DB_SERVER=host.docker.internal
      - DB_DATABASE=SmartParkingDB
      - DB_PORT=1433
      - DB_USER=smartparking_user
      - DB_PASSWORD=123456
      - OCR_SERVICE_URL=http://ocr_service:6000/ocr

    depends_on:
      sqlserver:
        condition: service_healthy
      ocr_service:
        condition: service_started
  frontend:
    build:
      context: ./frontend
    container_name: smartparking_frontend
    ports:
      - "80:80"
volumes:
  sqlserver_data:
